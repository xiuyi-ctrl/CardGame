name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^v', ''
          npm pkg set version=$v

      - name: Build and package
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          npx electron-builder --win portable

      - name: Create Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-ChildItem release/*.exe | Select-Object -First 1
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $uploadPath = "release/pet-card-rogue-$releaseVersion-windows.exe"
          Copy-Item -LiteralPath $package.FullName -Destination $uploadPath
          gh release create "$env:GITHUB_REF_NAME" "$uploadPath" --generate-notes
