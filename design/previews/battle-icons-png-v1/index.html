<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>战斗图标 PNG · 第一批</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #101c2c; background: #173943; }
    body { max-width: 850px; margin: 0 auto; padding: 28px; }
    h1 { color: #fff9e9; font-size: 26px; margin: 0 0 8px; }
    p { color: #d0e8dd; margin: 0 0 20px; }
    section { background: #fff9e9; border: 5px solid #101c2c; box-shadow: 6px 6px 0 #0c232d; padding: 18px; margin-bottom: 18px; }
    h2 { margin: 0 0 14px; font-size: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; }
    figure { margin: 0; min-width: 110px; text-align: center; background: #e2f5d3; border: 2px solid #8a979b; padding: 10px; }
    figure img { display: block; width: 48px; height: 48px; margin: 0 auto 8px; object-fit: contain; image-rendering: pixelated; }
    figure.stat img { width: 26px; height: 26px; margin-block: 11px 19px; }
    figcaption { font-weight: 700; font-size: 14px; }
    .battle { background: #4cae4f; }
    .battle figure { background: transparent; border-color: #35854a; }
    .battle strong { display: inline-flex; align-items: center; gap: 4px; font-size: 20px; }
    .battle strong img { width: 24px; height: 24px; image-rendering: pixelated; }
  </style>
</head>
<body>
  <h1>战斗图标 PNG · 第一批</h1>
  <p>透明底像素图标；下方同时检查常规尺寸和草地背景。</p>
  <section>
    <h2>属性</h2>
    <div class="row">
      <figure class="stat"><img src="life.png" alt="生命" /><figcaption>生命 · 26 px</figcaption></figure>
      <figure class="stat"><img src="speed.png" alt="速度" /><figcaption>速度 · 26 px</figcaption></figure>
    </div>
  </section>
  <section>
    <h2>战斗药水</h2>
    <div class="row">
      <figure><img src="atk_up.png" alt="攻击药水" /><figcaption>攻击提高</figcaption></figure>
      <figure><img src="spd_up.png" alt="加速药水" /><figcaption>速度提高</figcaption></figure>
      <figure><img src="hp_up.png" alt="生命药水" /><figcaption>生命提高</figcaption></figure>
      <figure><img src="atk_down.png" alt="虚弱药水" /><figcaption>虚弱药水</figcaption></figure>
      <figure><img src="spd_down.png" alt="缓速药水" /><figcaption>缓速药水</figcaption></figure>
      <figure><img src="hp_down.png" alt="腐蚀药水" /><figcaption>腐蚀药水</figcaption></figure>
    </div>
  </section>
  <section class="battle">
    <h2>战场尺寸预览</h2>
    <strong><img src="life.png" alt="" />7/10　<img src="speed.png" alt="" />5</strong>
  </section>
</body>
</html>
