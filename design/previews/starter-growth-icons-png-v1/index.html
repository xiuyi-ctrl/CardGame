<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>开局与成长入口 PNG · 第四批</title>
  <style>
    :root { font-family: 'Microsoft YaHei', system-ui, sans-serif; background: #1384c8; color: #101c2c; }
    body { max-width: 1080px; margin: 0 auto; padding: 24px; }
    h1 { color: #fff9e9; font-size: 30px; text-shadow: 3px 3px #101c2c; }
    p { color: #eef9fb; }
    h2 { margin: 24px 0 9px; color: #fff9e9; }
    .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
    figure { display: grid; place-items: center; gap: 8px; margin: 0; min-height: 132px; padding: 10px; border: 4px solid #101c2c; background: #fff9e9; box-shadow: 5px 5px 0 #065077; text-align: center; }
    figure img { width: 66px; height: 66px; object-fit: contain; image-rendering: pixelated; }
    figure.small img { width: 24px; height: 24px; }
    figure figcaption { font-size: 15px; font-weight: 900; }
    figure small { display: block; color: #607580; font-size: 11px; font-weight: 600; }
    @media (max-width: 730px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <h1>开局与成长入口 · 第四批 PNG</h1>
  <p>10 枚独立透明图标。难度与遗物预览为 66 px，商店与战后恢复按实际约 24 px 展示；已接入游戏。</p>
  <h2>难度与标题</h2>
  <div class="grid">
    <figure><img src="icons/difficulty-header.png" alt="" /><figcaption>难度标题<small>difficulty-header</small></figcaption></figure>
    <figure><img src="icons/difficulty-normal.png" alt="" /><figcaption>普通<small>difficulty-normal</small></figcaption></figure>
    <figure><img src="icons/difficulty-hard.png" alt="" /><figcaption>困难<small>difficulty-hard</small></figcaption></figure>
    <figure><img src="icons/difficulty-nightmare.png" alt="" /><figcaption>地狱<small>difficulty-nightmare</small></figcaption></figure>
    <figure><img src="icons/starter-paw.png" alt="" /><figcaption>选宠标题爪印<small>starter-paw</small></figcaption></figure>
  </div>
  <h2>初始遗物与属性</h2>
  <div class="grid">
    <figure><img src="icons/traveler_charm.png" alt="" /><figcaption>旅者护符<small>traveler_charm</small></figcaption></figure>
    <figure><img src="icons/elite_badge.png" alt="" /><figcaption>精锐之证<small>elite_badge</small></figcaption></figure>
    <figure><img src="icons/beast_master.png" alt="" /><figcaption>驯兽大师<small>beast_master</small></figcaption></figure>
    <figure class="small"><img src="icons/difficulty-shop.png" alt="" /><figcaption>商店<small>difficulty-shop · 24 px</small></figcaption></figure>
    <figure class="small"><img src="icons/difficulty-recovery.png" alt="" /><figcaption>战后恢复<small>difficulty-recovery · 24 px</small></figcaption></figure>
  </div>
</body>
</html>
