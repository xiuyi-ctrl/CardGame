<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三只生物像素统一对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#142936;color:#fff9e9;font-family:'Microsoft YaHei',sans-serif;padding:24px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:24px}header p,footer p{font-size:13px;color:#bbd1cd}.panels{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:16px 0}.panel{border:3px solid #8a979b;background:#fff9e9;color:#101c2c}.panel.after{border-color:#63c5ad}h2{font-size:20px;margin:0;padding:14px;border-bottom:2px solid #c9c9bc}h2 small{display:block;margin-top:5px;font-size:13px;font-weight:400;color:#52636c}.stage{display:flex;justify-content:space-evenly;align-items:end;gap:8px;padding:32px 12px;min-height:280px}figure{width:30%;margin:0;text-align:center}.slot{width:100%;aspect-ratio:1;display:grid;place-items:center}.slot img,.slot canvas{width:100%;height:100%;object-fit:contain}canvas,.after img{image-rendering:pixelated}.before canvas{filter:drop-shadow(2px 3px 0 #102b2d)}figcaption{font-weight:700;font-size:14px;margin-top:12px}button{min-height:44px;padding:8px 18px;border:2px solid #8a979b;background:#fff9e9;font:14px 'Microsoft YaHei',sans-serif;cursor:pointer}button[aria-pressed=true]{background:#b9e5d5;border-color:#63c5ad}.forest .stage{background:url('../../../public/main-flow-art/partner-camp.png') center/cover}.forest figcaption{background:#fff9e9;padding:3px}.forest h2{background:#fff9e9}@media(max-width:750px){body{padding:8px}h1{font-size:18px}header p{display:none}.panels{gap:8px}.stage{min-height:180px;padding:12px 6px}h2{font-size:16px;padding:8px}h2 small{font-size:12px}footer{flex-wrap:wrap}}
</style></head><body>
<header><h1>生物像素统一 · 三只对照</h1><p>迅迅 / 咪咪 / 煤煤</p></header>
<div class="panels">
<section class="panel before"><h2>当前显示<small>画布与清晰原稿混用，部分带额外投影</small></h2><div class="stage">
<figure><div class="slot"><canvas width="64" height="64" data-src="baseline/battle-momo.png" aria-label="迅迅"></canvas></div><figcaption>迅迅</figcaption></figure>
<figure><div class="slot"><canvas width="64" height="64" data-src="baseline/mimi.png" aria-label="咪咪"></canvas></div><figcaption>咪咪</figcaption></figure>
<figure><div class="slot"><img src="baseline/coal.png" alt="煤煤"></div><figcaption>煤煤</figcaption></figure>
</div></section>
<section class="panel after"><h2>统一样例<small>64像素 · 最多24色 · 硬透明边缘 · 底部y=59</small></h2><div class="stage">
<figure><div class="slot"><img src="assets/xunxun.png" alt="迅迅"></div><figcaption>迅迅</figcaption></figure>
<figure><div class="slot"><img src="assets/mimi.png" alt="咪咪"></div><figcaption>咪咪</figcaption></figure>
<figure><div class="slot"><img src="assets/coal.png" alt="煤煤"></div><figcaption>煤煤</figcaption></figure>
</div></section></div>
<footer><p>右侧样例已接入三只生物，左侧保留改动前原稿。</p><div><button aria-pressed="true" data-mode="plain">浅色底</button> <button aria-pressed="false" data-mode="forest">森林底</button></div></footer>
<script>
document.querySelectorAll('canvas').forEach(canvas=>{const img=new Image();img.onload=()=>canvas.getContext('2d').drawImage(img,0,0,64,64);img.src=canvas.dataset.src});
document.querySelectorAll('button').forEach(button=>button.onclick=()=>{document.body.classList.toggle('forest',button.dataset.mode==='forest');document.querySelectorAll('button').forEach(other=>other.setAttribute('aria-pressed',String(other===button)))});
</script></body></html>
