<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>地图节点图标 PNG · 第二批</title>
  <style>
    :root { font-family: system-ui, sans-serif; background: #10283d; color: #fff9e9; }
    body { max-width: 940px; margin: 0 auto; padding: 26px; }
    h1 { margin: 0 0 7px; font-size: 28px; }
    p { margin: 0 0 20px; color: #c7dce0; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    figure { margin: 0; padding: 10px 8px; border: 3px solid #7d97a0; background: #fff9e9; color: #101c2c; text-align: center; box-shadow: 4px 4px 0 #050c17; }
    .stele { display: grid; place-items: center; width: 98px; height: 98px; margin: 0 auto 8px; background: url('../../../public/map-node-stele.png') center / contain no-repeat; image-rendering: pixelated; }
    .stele img { display: block; width: 45px; height: 45px; object-fit: contain; image-rendering: pixelated; }
    figcaption { font-size: 15px; font-weight: 800; }
    small { display: block; margin-top: 3px; color: #65737b; font-size: 12px; font-weight: 600; }
    @media(max-width:700px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <h1>地图节点图标 PNG · 第二批</h1>
  <p>16 种节点，按地图石碑上的 45 px 显示尺寸预览。图标已接入运行时。</p>
  <main class="grid">
    <figure><div class="stele"><img src="icons/battle.png" alt="" /></div><figcaption>普通战斗<small>battle</small></figcaption></figure>
    <figure><div class="stele"><img src="icons/elite.png" alt="" /></div><figcaption>精英<small>elite</small></figcaption></figure>
    <figure><div class="stele"><img src="icons/boss.png" alt="" /></div><figcaption>首领<small>boss</small></figcaption></figure>
    <figure><div class="stele"><img src="icons/guardian.png" alt="" /></div><figcaption>守卫<small>guardian</small></figcaption></figure>
    <figure><div class="stele"><img src="icons/rest.png" alt="" /></div><figcaption>休整<small>rest</small></figcaption></figure>
    <figure><div class="stele"><img src="icons/shop.png" alt="" /></div><figcaption>商店<small>shop</small></figcaption></figure>
    <figure><div class="stele"><img src="icons/event.png" alt="" /></div><figcaption>事件<small>event</small></figcaption></figure>
    <figure><div class="stele"><img src="icons/special.png" alt="" /></div><figcaption>奇遇<small>special</small></figcaption></figure>
    <figure><div class="stele"><img src="icons/arena.png" alt="" /></div><figcaption>竞技场<small>arena</small></figcaption></figure>
    <figure><div class="stele"><img src="icons/gauntlet.png" alt="" /></div><figcaption>车轮战<small>gauntlet</small></figcaption></figure>
    <figure><div class="stele"><img src="icons/corrupted.png" alt="" /></div><figcaption>侵蚀<small>corrupted</small></figcaption></figure>
    <figure><div class="stele"><img src="icons/watchtower.png" alt="" /></div><figcaption>瞭望塔<small>watchtower</small></figcaption></figure>
    <figure><div class="stele"><img src="icons/sync.png" alt="" /></div><figcaption>双生宝箱<small>sync</small></figcaption></figure>
    <figure><div class="stele"><img src="icons/keydoor.png" alt="" /></div><figcaption>钥匙门<small>keydoor</small></figcaption></figure>
    <figure><div class="stele"><img src="icons/blacksmith.png" alt="" /></div><figcaption>铁匠铺<small>blacksmith</small></figcaption></figure>
    <figure><div class="stele"><img src="icons/arena3.png" alt="" /></div><figcaption>三模式竞技场<small>arena3</small></figcaption></figure>
  </main>
</body>
</html>
