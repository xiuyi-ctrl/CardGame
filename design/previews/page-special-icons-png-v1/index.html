<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>页面专用图标 PNG · 第五批</title>
  <style>
    :root { font-family: 'Microsoft YaHei', system-ui, sans-serif; color: #101c2c; background: #1682be; }
    body { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1, h2 { color: #fff9e9; text-shadow: 3px 3px #101c2c; }
    h1 { font-size: 30px; }
    p { color: #eef9fb; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    figure { display: grid; place-items: center; margin: 0; padding: 16px 8px; min-height: 178px; border: 4px solid #101c2c; background: #fff9e9; box-shadow: 5px 5px 0 #065077; text-align: center; }
    figure img { width: 94px; height: 94px; object-fit: contain; image-rendering: pixelated; }
    figure figcaption { font-size: 16px; font-weight: 900; }
    figure small { display: block; color: #607580; font-size: 11px; font-weight: 600; }
    .size-check { display: flex; align-items: center; gap: 14px; }
    .size-check img { width: 36px; height: 36px; image-rendering: pixelated; }
    .size-check img.large { width: 64px; height: 64px; }
    @media (max-width: 730px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <h1>其余页面专用图标 · 第五批 PNG</h1>
  <p>11 张独立透明图，已接入游戏对应页面。下方附有 36 / 64 像素缩小检查。</p>
  <h2>页面操作与结果</h2>
  <div class="grid">
    <figure><img src="icons/victory-swords.png" alt="" /><figcaption>胜利双剑<small>victory-swords</small></figcaption></figure>
    <figure><img src="icons/shop-refresh.png" alt="" /><figcaption>商店刷新<small>shop-refresh</small></figcaption></figure>
    <figure><img src="icons/watchtower-telescope.png" alt="" /><figcaption>瞭望塔<small>watchtower-telescope</small></figcaption></figure>
    <figure><img src="icons/chest-open.png" alt="" /><figcaption>宝箱结果<small>chest-open</small></figcaption></figure>
    <figure><img src="icons/upgrade-anvil.png" alt="" /><figcaption>强化铁砧<small>upgrade-anvil</small></figcaption></figure>
  </div>
  <h2>竞技场三模式</h2>
  <div class="grid">
    <figure><img src="icons/arena-simulation.png" alt="" /><figcaption>模拟战<small>蓝色镜晶</small></figcaption></figure>
    <figure><img src="icons/arena-challenge.png" alt="" /><figcaption>挑战赛<small>红色战旗</small></figcaption></figure>
    <figure><img src="icons/arena-exhibition.png" alt="" /><figcaption>表演赛<small>紫色舞台</small></figcaption></figure>
  </div>
  <h2>造物模板</h2>
  <div class="grid">
    <figure><img src="icons/creation-custom_guardian.png" alt="" /><figcaption>守护模板<small>岩甲剪影</small></figcaption></figure>
    <figure><img src="icons/creation-custom_fury.png" alt="" /><figcaption>狂怒模板<small>火尾剪影</small></figcaption></figure>
    <figure><img src="icons/creation-custom_gale.png" alt="" /><figcaption>疾风模板<small>展翼剪影</small></figcaption></figure>
  </div>
  <h2>缩小检查</h2>
  <figure class="size-check"><img src="icons/shop-refresh.png" alt="刷新 36 像素" /><img class="large" src="icons/shop-refresh.png" alt="刷新 64 像素" /><img src="icons/arena-simulation.png" alt="模拟战 36 像素" /><img class="large" src="icons/arena-simulation.png" alt="模拟战 64 像素" /><img src="icons/creation-custom_gale.png" alt="疾风模板 36 像素" /><img class="large" src="icons/creation-custom_gale.png" alt="疾风模板 64 像素" /><figcaption>36 / 64 px</figcaption></figure>
</body>
</html>
