<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>初始伙伴标题图标预览</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 30px; background: #39a9f4; color: #07182e; font-family: 'Microsoft YaHei', sans-serif; }
    .panel { display: flex; align-items: center; gap: 22px; max-width: 900px; padding: 24px 32px; border: 6px solid #07182e; background: #fff9e9; box-shadow: inset 0 0 0 4px #dddcd3, 5px 5px 0 #06456b; }
    .icon { width: 72px; height: 72px; image-rendering: pixelated; }
    h1 { margin: 0; font-size: 42px; line-height: 1.1; letter-spacing: .03em; text-shadow: 2px 2px #07182e; }
    .orange { color: #ffa900; }.blue { color: #45c5ee; }
    .sizes { display: flex; align-items: center; gap: 10px; margin-top: 20px; color: #526374; font-size: 15px; font-weight: 700; }
    .small { width: 32px; height: 32px; image-rendering: pixelated; }
  </style>
</head>
<body>
  <div class="panel">
    <img class="icon" src="starter-header-paw-icon.svg" alt="伙伴爪印徽章">
    <h1><span class="orange">选择</span><span class="blue">初始伙伴</span></h1>
  </div>
  <div class="sizes">原生 32×32：<img class="small" src="starter-header-paw-icon.svg" alt="伙伴爪印徽章"></div>
</body>
</html>
